<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid in tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-grey-100">
    <!-- Live Demo (grid system) grid, grid-cols-2, gap-4, col-span-2 -->
    <div class="grid grid-cols-2 gap-4">
        <div class="bg-blue-500 p-6 text-white">1</div>
        <div class="bg-green-500 p-6 text-white">2</div>
        <div class="bg-red-500 p-6 text-white">3</div>
        <div class="bg-yellow-500 p-6 text-white">4</div>
        <div class="bg-purple-500 p-6 text-white">5</div>
        <div class="bg-pink-500 p-6 text-white">6</div>
    </div>
</body>
</html>
