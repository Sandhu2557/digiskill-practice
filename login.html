<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      width: 320px;
      padding: 24px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      border-radius: 12px;
    }
    .login-box h2 {
      margin: 0 0 20px;
      font-size: 24px;
      text-align: center;
      color: #333;
    }
    .login-box label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #555;
    }
    .login-box input {
      width: 100%;
      padding: 12px 10px;
      margin-bottom: 16px;
      border: 1px solid #ccd0d5;
      border-radius: 8px;
      font-size: 14px;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #1877f2;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    .login-box button:hover {
      background: #165ec9;
    }
    .login-box .links {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
    }
    .login-box .links a {
      color: #1877f2;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>
    <form>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>
      <button type="submit">Sign In</button>
    </form>
    <div class="links">
      <p><a href="#">Forgot password?</a></p>
      <p><a href="#">Create an account</a></p>
    </div>
  </div>
</body>
</html>
