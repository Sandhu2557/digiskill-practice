<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --radius:20px;
           --padding:50px;
        }
        .card{
            --border:1px solid rgb(231, 16, 16);
            border: var(--border);
            border-radius: 10px var(--radius);
            padding: var(--padding);
            margin: 20px;
        }
    </style>
</head>
<body>
    <div class="card">Card One</div>
    <div class="card">Card Two</div>
</body>
</html>
