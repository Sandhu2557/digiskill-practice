<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive website in Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <h1 class="text-sm md:text-xl lg:text-4xl">Responsive Heading</h1>
    <div class="bg-blue-500 md:bg-green-500 lg:bg-red-500 xl:bg-yellow-500 p-10">Responsive</div>

    <div class="grid gird-cols-1 md:gird-cols-2 lg:grid-cols-3 gap-4">
        <div class="bg-red-300 p-5">1</div>
        <div class="bg-green-300 p-5">2</div>
        <div class="bg-blue-300 p-5">3</div>
        <div class="bg-yellow-300 p-5">4</div>
        <div class="bg-purple-300 p-5">5</div>
        <div class="bg-pink-300 p-5">6</div>
    </div>
</body>
</html>
