<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Full Example</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-grey-200">
    <div class=""container mx-auto">
        <header class="flex justify-between item-center bg-blue-600 text-white p-5">
            <h1 class="text-2xl font-bold">My Website</h1>
            <nav class="flex gap-4">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </header>
        <section class="grid grid-cols-3 gap-5 mt-8">
            <div class="bg-white p-5 rounded shadow">Card 1</div>
            <div class="bg-white p-5 rounded shadow">Card 2</div>
            <div class="bg-white p-5 rounded shadow">Card 3</div> 
            <div class="bg-white p-5 rounded shadow">Card 4</div>
            <div class="bg-white p-5 rounded shadow">Card 5</div>
        </section>
        <footer class="mt-10 bg-gray-800 p-5 text-center text-white">
            Copyright 2026
        </footer>
    </div>   
</body>
</html>
